# Empty rather than "no" because several upstream dracut module check()
# functions test `[[ $hostonly ]]` (non-empty) when they should test
# `[[ $hostonly == yes ]]`. `hostonly="no"` is a non-empty string, so it
# trips those checks (e.g. the 70crypt module skips itself) — sending
# crypttab/LUKS handling into a host-specific branch that fails in
# chroot. dracut's main logic checks for "yes" explicitly, so empty and
# "no" are semantically identical for selecting generic mode.
hostonly=""

# dracut would otherwise store the build host's view of the root device in
# the initramfs as extra kernel arguments: the chroot's temporary mapper name
# as root=, and the image's build-time LUKS UUID as rd.luks.uuid=. Neither
# describes the machine the image boots on, and the LUKS UUID is rotated on
# first boot (r[image.identity.rotate]), after which dracut would wait for a
# volume by that UUID until it gave up on the boot. The boot loader's
# command line and crypttab already say everything the initramfs needs.
hostonly_cmdline="no"
# The one stored argument worth keeping: load btrfs before udev scans for it.
force_drivers+=" btrfs "
